<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sito in Manutenzione</title>
    <style>
        /* Tailwind-inspired custom styling */
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to right, #0066d3, #3B82F6);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 30px;
            max-width: 600px;
            background-color: rgba(0, 0, 0, 0.5); /* Dark background with opacity */
            border-radius: 12px;
            box-shadow: 0px 4px 30px rgba(0, 0, 0, 0.3);
            padding-top: 40px;
            padding-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: white; /* Soft yellow */
            margin-bottom: 20px;
            margin-top: 5px;
        }

        p {
            color: #F3F4F6; /* Light gray text */
            margin-bottom: 35px;
        }

        .button {
            padding: 12px 30px;
            margin-bottom: 20px;
            background-color: #3B82F6; /* Indigo blue */
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-decoration: none;
        }

        .button:hover {
            background-color: #2563EB; /* Slightly darker indigo for hover effect */
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container p-4">
        <h1>Sito in Manutenzione</h1>
        <p>Ci scusiamo per l'inconveniente. Stiamo lavorando per migliorare il nostro sito web. Torneremo online
            al più presto. Nel frattempo, puoi contattarci o visitare altre risorse online.</p>
        <a href="mailto:support@real-ei.it" class="button">Contattaci</a>
    </div>
</body>

</html>
