load_module modules/ngx_http_geoip2_module.so;

events {}


http {
    resolver 127.0.0.11 ipv6=off;
    include       mime.types;
    default_type  application/octet-stream;

    set_real_ip_from 172.20.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # GZIP Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;

    map $sent_http_content_type $expires {
        default                    off;
        image/jpeg                 30d;
        image/png                  30d;
        image/gif                  30d;
        image/webp                 30d;
        image/svg+xml              30d;
        video/mp4                  30d;
        video/webm                 30d;
        text/css                   7d;
        application/javascript     7d;
        application/x-javascript   7d;
    }
    

    geoip2 /etc/nginx/geoip/GeoLite2-City.mmdb {
        $geoip2_country_code country iso_code;
    }

    map $geoip2_country_code $allow_country {
        default 0;
        IT      1;
    }



    log_format main '$remote_addr '
                'country="$geoip2_country_code" '
                'xff="$http_x_forwarded_for" '
                'realip="$realip_remote_addr" '
                '- $remote_user [$time_local] "$request" '
                'status=$status upstream_status=$upstream_status '
                'upstream_addr=$upstream_addr '
                'upstream_response_time=$upstream_response_time '
                'body=$body_bytes_sent '
                '"$http_referer" "$http_user_agent"';



    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;


    # -----------------------------
    # Rate limiting zones
    # -----------------------------

    map $http_user_agent $block_bad_uri {
        default 0;
        ~*(bot|crawler|spider|scrapy|curl|wget|python|nikto|sqlmap) 1;
    }

    map $http_origin $admin_cors_origin {
        default "";
        "https://imp-active.it" $http_origin;
    }

    # General traffic (pages)
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

    # API traffic (stricter)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Auth endpoints (very strict)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Optional: connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;




    # =========================
    # DEFAULT HTTPS - BLOCK UNKNOWN HOSTS
    # =========================
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        return 444;
    }





    # =========================
    # LANDING PAGE - HTTP
    # =========================
    server {
        listen 80;
        listen [::]:80;
        server_name imp-active.it www.imp-active.it;

        if ($block_bad_uri) {
            return 444;
        }

        # ACME challenge (Certbot)
        location /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt/challenges;
            default_type "text/plain";
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }

        client_max_body_size 10M;
        add_header X-Request-ID $request_id;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
    }



    

    server {
        listen 443 ssl http2;
        limit_conn conn_limit 30;
        server_name imp-active.it www.imp-active.it;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;


        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Request-ID $request_id;
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "no-referrer-when-downgrade";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://imp-active.it https://auth.imp-active.it; worker-src 'self' blob:; child-src 'self' blob:;" always;


        # --- ERROR PAGES ---
        error_page 502 /maintenance.html;
        error_page 504 /maintenance.html;

        location = /maintenance.html {
            root /usr/share/nginx/html;
            internal;
        }


        location ^~ /api/auth/ {
            add_header X-Debug-Auth-Route "USER-AUTH" always;
            add_header X-Debug-Host "$host" always;
            add_header X-Debug-Forwarded-Proto "$http_x_forwarded_proto" always;

            proxy_pass http://impactive_frontend:3000/api/auth/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_set_header Connection "";

            proxy_buffer_size 128k;
            proxy_buffers 8 128k;
            proxy_busy_buffers_size 256k;

            proxy_buffering off;
            proxy_cache off;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }




        location ^~ /_next/ {
            proxy_pass http://impactive_frontend:3000/_next/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;

            proxy_buffering off;
            proxy_cache off;

            add_header Cache-Control "no-store";
        }


    
        # frontend
        location / {
            limit_req zone=general burst=40 nodelay;
            proxy_pass http://impactive_frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }


        # API backend
        location /api/v1/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://172.20.0.30:8082/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        client_max_body_size 10M;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
    }




    # =========================
    # ADMIN PANEL - HTTP
    # =========================
    server {
        listen 80;
        listen [::]:80;
        server_name admin.imp-active.it;

        if ($allow_country = 0) {
            return 403;
        }

        location /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt/challenges;
            default_type "text/plain";
        }

        location / {
            if ($allow_country = 0) {
                return 403;
            }
            return 301 https://$host$request_uri;
        }

        client_max_body_size 10M;
        add_header X-Request-ID $request_id;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
    }


    # =========================
    # ADMIN PANEL - HTTPS
    # =========================
    server {
        listen 443 ssl http2;
        limit_conn conn_limit 30;
        server_name admin.imp-active.it;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # -------------------
        # Security headers
        # -------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Request-ID $request_id;
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "noreferrer-when-downgrade";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://imp-active.it https://auth.imp-active.it; worker-src 'self' blob:; child-src 'self' blob:;" always;


        
        # --- ERROR PAGES ---
        error_page 502 /maintenance.html;
        error_page 504 /maintenance.html;

        location = /maintenance.html {
            root /usr/share/nginx/html;
            internal;
        }

        location ^~ /api/auth/ {
            add_header X-Debug-Auth-Route "ADMIN-NGINX" always;
            add_header X-Debug-Request-ID $request_id always;
            add_header X-Debug-URI "$request_uri" always;

            proxy_pass http://impactive_frontend_admin:3000/api/auth/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_set_header Connection "";

            proxy_buffer_size 32k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;

            proxy_buffering off;
            proxy_cache off;
        }


        location ^~ /_next/ {
            proxy_pass http://impactive_frontend_admin:3000/_next/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            access_log off;
            proxy_cache_bypass $http_cache_control;
            proxy_buffering on;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }


        # ============================================================
        # ADMIN BACKEND API
        # ============================================================

        location ^~ /api/v1/admin/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://impactive_backend_admin:8082;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            add_header X-Request-ID $request_id always;
        }


        # frontend
        location / {
            if ($allow_country = 0) {
                return 403;
            }

            limit_req zone=general burst=40 nodelay;
            proxy_pass http://impactive_frontend_admin:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
        }
    }





    # =========================
    # AUTH - HTTP
    # =========================
    server {
        listen 80;
        listen [::]:80;
        server_name auth.imp-active.it;

        location /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt/challenges;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }


    # =========================
    # AUTH - HTTPS / KEYCLOAK
    # =========================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name auth.imp-active.it;

        if ($allow_country = 0) {
            return 403;
        }
        
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://auth.imp-active.it https://keycloak-admin.imp-active.it" always;


        # =========================
        # KEYCLOAK RESOURCES
        # =========================
        location ^~ /resources/ {
            proxy_pass http://172.20.0.5:8080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_read_timeout 60s;
            proxy_set_header Accept-Encoding "";
            gzip off;
            proxy_buffering off;
            proxy_cache off;
            access_log on;
        }


        # =========================
        # KEYCLOAK OIDC / REALMS
        # =========================
        location ^~ /realms/ {
            proxy_pass http://172.20.0.5:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_read_timeout 60s;
        }

        # =========================
        # EVERYTHING ELSE
        # =========================
        location / {

            if ($allow_country = 0) {
                return 403;
            }
            proxy_pass http://172.20.0.5:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_read_timeout 60s;
        }
    }


    # =========================
    # KEYCLOAK ADMIN - HTTP
    # VPN ONLY
    # =========================
    server {
        listen 80;
        listen [::]:80;
        server_name keycloak-admin.imp-active.it;

        location /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt/challenges;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }


    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name keycloak-admin.imp-active.it;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://auth.imp-active.it https://keycloak-admin.imp-active.it" always;

        location / {

            allow 10.50.0.0/24;
            deny all;
            
            proxy_pass http://172.20.0.5:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_read_timeout 60s;
        }
    }
}
